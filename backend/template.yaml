AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ApplyShield - recruitment risk analysis using AWS serverless services

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 20
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref AnalysesTable
        EVIDENCE_BUCKET: !Ref EvidenceBucket
        ALLOWED_ORIGIN: !Ref FrontendOrigin
    Tags:
      Project: ApplyShield

Parameters:
  StageName:
    Type: String
    Default: prod
  FrontendOrigin:
    Type: String
    Default: http://localhost:5500
    Description: Exact browser origin allowed to call the API and upload evidence (no trailing slash)

Resources:
  ApplyShieldApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref StageName
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,x-session-id'"
        AllowOrigin: !Sub "'${FrontendOrigin}'"
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 10

  AnalysesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: S
        - AttributeName: analysisId
          AttributeType: S
      KeySchema:
        - AttributeName: sessionId
          KeyType: HASH
        - AttributeName: analysisId
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  EvidenceBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireEvidence
            Status: Enabled
            ExpirationInDays: 30
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [PUT, GET, HEAD]
            AllowedOrigins:
              - !Ref FrontendOrigin
            MaxAge: 3000

  UploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/upload/
      Handler: app.handler
      Policies:
        - S3WritePolicy:
            BucketName: !Ref EvidenceBucket
      Events:
        Presign:
          Type: Api
          Properties:
            RestApiId: !Ref ApplyShieldApi
            Path: /uploads/presign
            Method: POST

  StartAnalysisFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/start-analysis/
      Handler: app.handler
      Timeout: 20
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref AnalysisStateMachine
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AnalysesTable
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt AnalysisStateMachine.Name
      Events:
        Start:
          Type: Api
          Properties:
            RestApiId: !Ref ApplyShieldApi
            Path: /analyses
            Method: POST

  GetAnalysisFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/get-analysis/
      Handler: app.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AnalysesTable
      Events:
        Get:
          Type: Api
          Properties:
            RestApiId: !Ref ApplyShieldApi
            Path: /analyses/{id}
            Method: GET
        List:
          Type: Api
          Properties:
            RestApiId: !Ref ApplyShieldApi
            Path: /analyses
            Method: GET

  ExtractFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/extractor/
      Handler: app.handler
      Timeout: 30
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref EvidenceBucket

  DetectFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/risk-detector/
      Handler: app.handler

  VerifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/verification/
      Handler: app.handler

  ScoreFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/risk-scorer/
      Handler: app.handler

  ReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/report-generator/
      Handler: app.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AnalysesTable

  FailureHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/failure-handler/
      Handler: app.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AnalysesTable

  AnalysisStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD
      DefinitionUri: workflows/analysis.asl.json
      DefinitionSubstitutions:
        ExtractArn: !GetAtt ExtractFunction.Arn
        DetectArn: !GetAtt DetectFunction.Arn
        VerifyArn: !GetAtt VerifyFunction.Arn
        ScoreArn: !GetAtt ScoreFunction.Arn
        ReportArn: !GetAtt ReportFunction.Arn
        FailureHandlerArn: !GetAtt FailureHandlerFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref ExtractFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref DetectFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref VerifyFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref ScoreFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref ReportFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref FailureHandlerFunction

Outputs:
  ApiBaseUrl:
    Description: API Gateway base URL
    Value: !Sub 'https://${ApplyShieldApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}'
  EvidenceBucketName:
    Value: !Ref EvidenceBucket
  AnalysesTableName:
    Value: !Ref AnalysesTable
  StateMachineArn:
    Value: !Ref AnalysisStateMachine
